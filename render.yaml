# Blueprint do Render: cria o site (web service) e o banco PostgreSQL juntos.
services:
  - type: web
    name: despesas-viagem
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: despesas-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_USER
        value: admin
      - key: APP_PASSWORD
        sync: false # o Render pergunta o valor na criação; não fica no Git

databases:
  - name: despesas-db
    plan: free
