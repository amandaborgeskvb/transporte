# Blueprint do Render: cria o site (web service).
# O banco PostgreSQL já existe na conta (o plano gratuito permite só um), então
# a DATABASE_URL é informada na criação do Blueprint.
services:
  - type: web
    name: despesas-viagem
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Internal Database URL do PostgreSQL existente
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_USER
        value: admin
      - key: APP_PASSWORD
        sync: false # o Render pergunta o valor na criação; não fica no Git
